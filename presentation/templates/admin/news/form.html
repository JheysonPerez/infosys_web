{% extends "base.html" %}

{% block title %}
    {{ "Editar Noticia" if news else "Nueva Noticia" }} | Info & Sys
{% endblock %}

{% block content %}

<h2 class="mb-4">
    {{ "Editar Noticia" if news else "Registrar Nueva Noticia" }}
</h2>

<form method="post" enctype="multipart/form-data">

    <div class="card p-4 shadow-sm">

        <div class="mb-3">
            <label class="form-label">Título <span class="text-danger">*</span></label>
            <input type="text"
                   name="title"
                   class="form-control"
                   value="{{ news.title if news else '' }}"
                   required
                   minlength="5"
                   placeholder="Ej: Nueva Capacitación en Contrataciones">
        </div>

        <div class="mb-3">
            <label class="form-label">Contenido <span class="text-danger">*</span></label>
            <textarea name="content"
                      rows="6"
                      class="form-control"
                      required
                      minlength="50"
                      placeholder="Escribe aquí el contenido completo de la noticia">{{ news.content if news else '' }}</textarea>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Fecha de publicación <span class="text-danger">*</span></label>
                <input type="date"
                       name="published_at"
                       class="form-control"
                       value="{{ news.published_at.strftime('%Y-%m-%d') if news and news.published_at else '' }}"
                       required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Fecha de expiración</label>
                <input type="date"
                       name="expires_at"
                       class="form-control"
                       value="{{ news.expires_at.strftime('%Y-%m-%d') if news and news.expires_at else '' }}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Imagen</label>
            <input type="file" name="image" class="form-control">

            {% if news and news.image %}
                <div class="mt-3">
                    <img src="{{ url_for('static', filename='images/news/' + news.image) }}"
                         class="img-fluid rounded shadow-sm"
                         style="max-height: 200px;">
                </div>
            {% endif %}
        </div>

        <div class="form-check mb-4">
            <input class="form-check-input"
                   type="checkbox"
                   name="featured"
                   id="featured"
                   {% if news and news.featured %}checked{% endif %}>

            <label class="form-check-label" for="featured">
                Marcar como noticia destacada
            </label>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a href="{{ url_for('home.index') }}"
               class="btn btn-secondary">
                Cancelar
            </a>

            <button type="submit" class="btn btn-primary">
                {{ "Actualizar Noticia" if news else "Guardar Noticia" }}
            </button>
        </div>

    </div>

</form>

{% endblock %}
